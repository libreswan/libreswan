
config setup
	logfile=/tmp/pluto.log
	logtime=no
	logappend=no
	dumpdir=/tmp
	plutodebug=all
	ikev1-policy=accept

conn %default
     left=192.1.2.45
     right=192.1.2.23

conn ikev1-transcript=
	keyexchange=ikev1
	#ike-sa-init-full-transcript-auth=
conn ikev1-transcript=yes
	keyexchange=ikev1
	ike-sa-init-full-transcript-auth=yes
conn ikev1-transcript=no
	keyexchange=ikev1
	ike-sa-init-full-transcript-auth=no
conn ikev1-transcript=auto
	keyexchange=ikev1
	ike-sa-init-full-transcript-auth=auto

conn ikev2-transcript=
	keyexchange=ikev2
	#ike-sa-init-full-transcript-auth=
conn ikev2-transcript=yes
	keyexchange=ikev2
	ike-sa-init-full-transcript-auth=yes
conn ikev2-transcript=no
	keyexchange=ikev2
	ike-sa-init-full-transcript-auth=no
conn ikev2-transcript=auto
	keyexchange=ikev2
	ike-sa-init-full-transcript-auth=auto
