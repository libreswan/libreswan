connections {
	westnet-eastnet-ikev1 {
		#obsoleted option leftnexthop=192.1.2.23
		#=Right
		#obsoleted option rightnexthop=192.1.2.45
		# because strongswan doesn't do pfs=yes per default, unless you specify modp
		version=1
		remote_addrs=192.1.2.23
		local_addrs=192.1.2.45
		children {
			westnet-eastnet-ikev1 {
				start_action=none
				esp_proposals=aes128-sha1-modp2048, default
				local_ts=192.0.1.0/24
				remote_ts=192.0.2.0/24
			}
			
		}
		local-0 {
			auth = psk
			id = @west
		}
		remote-0 {
			auth = psk
			id = @east
		}
	}
}
pools {
}
authorities {
}
secrets {
	ike-@east@west {
		secret = "ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890"
		id-0=@east
		id-1=@west
	}
}
