version 2.0

config setup
	child-sa-pfs-info-supported=yes
	# put the logs in /tmp for the UMLs, so that we can operate
	# without syslogd, which seems to break on UMLs
	logfile=/tmp/pluto.log
	logtime=no
	logappend=no
	plutodebug=all
	dumpdir=/var/tmp

conn rw-east-pool-x509-ipv4
	also=rw-east-base-x509
	leftaddresspool=192.0.2.100-192.0.2.199
	rightsubnet=0.0.0.0/0
	optimized-rekey=yes
	pfs=yes
	esp=aes_gcm;dh19


conn rw-east-base-x509
	left=%any
	leftrsasigkey=%cert
	leftid=%fromcert
	right=192.1.2.23
	rightid=%fromcert
	rightrsasigkey=%cert
	rightcert=east
