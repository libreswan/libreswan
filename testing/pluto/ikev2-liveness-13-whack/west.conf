# /etc/ipsec.conf - Libreswan IPsec configuration file

version 2.0

config setup
	logfile=/tmp/pluto.log
	logtime=yes
	logappend=no
	plutodebug=all
	dumpdir=/tmp

conn westnet-eastnet
	left=192.1.2.45
	right=192.1.2.23
	leftid=@west
	rightid=@east
	leftsubnet=192.0.1.0/24
	rightsubnet=192.0.2.0/24
	authby=secret
