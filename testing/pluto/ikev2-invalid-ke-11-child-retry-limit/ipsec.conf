config setup
	logfile=/tmp/pluto.log
	logtime=no
	logappend=no
	plutodebug=base
	nhelpers=0

conn base
	keyexchange=ikev2
	left=192.1.2.45
	right=192.1.2.23
	leftid=@west
	rightid=@east
	leftsubnet=192.0.1.0/24
	authby=secret
	ike=aes128-sha2;dh14
	pfs=yes
	rekey=no

conn east
	also=base
	rightsubnets=192.0.2.0/24,192.0.20.0/24
	esp=aes_gcm;dh20

conn west-initial
	also=base
	rightsubnet=192.0.2.0/24
	esp=aes_gcm;dh19,aes_gcm;dh20

conn west-additional
	also=base
	rightsubnet=192.0.20.0/24
	esp=aes_gcm;dh19,aes_gcm;dh20
