# /etc/ipsec.conf - Libreswan IPsec configuration file

config setup
	logfile=/tmp/pluto.log
	logtime=no
	logappend=no
	dumpdir=/tmp
	plutodebug=all
	dnssec-enable=yes
	dnssec-rootkey-file=""
	dnssec-anchors=/testing/dnssec/keys/testing.key

conn %default
	leftid=@east.testing.libreswan.org
	

#copied from this test directory
include /etc/ipsec.d/ikev2-oe.conf