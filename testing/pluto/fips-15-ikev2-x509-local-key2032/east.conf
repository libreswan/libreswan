# /etc/ipsec.conf - Libreswan IPsec configuration file

version 2.0

config setup
	logfile=/tmp/pluto.log
	logtime=no
	logappend=no
	plutodebug=all
	dumpdir=/tmp

conn westnet-eastnet-ikev2
	authby=rsasig
	left=192.1.2.45
	leftid="%fromcert"
	leftsubnet=192.0.1.0/24
	right=192.1.2.23
	rightid="%fromcert"
	rightsubnet=192.0.2.0/24
	rightcert=key2032
