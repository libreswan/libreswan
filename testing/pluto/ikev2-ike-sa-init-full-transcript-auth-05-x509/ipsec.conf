# /etc/ipsec.conf - Libreswan IPsec configuration file

version 2.0

config setup
	# put the logs in /tmp for the UMLs, so that we can operate
	# without syslogd, which seems to break on UMLs
	logfile=/tmp/pluto.log
	logtime=no
	logappend=no
	plutodebug=all
	dumpdir=/tmp

conn west-east
	left=192.1.2.45
	leftid=%fromcert
	leftrsasigkey=%cert
	leftsubnet=192.0.1.0/24
	leftnexthop=192.1.2.23
	right=192.1.2.23
	rightid=%fromcert
	rightrsasigkey=%cert
	rightsubnet=192.0.2.0/24
	rightnexthop=192.1.2.45
	authby=rsasig
	ike-sa-init-full-transcript-auth=yes

conn west
	leftcert=west
	also=west-east

conn east
	rightcert=east
	also=west-east
