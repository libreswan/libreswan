config setup
	logfile=/tmp/pluto.log
	logtime=no
	logappend=no
	dumpdir=/tmp
	plutodebug=all
	ikev1-policy=accept

conn %default
     left=192.1.2.45
     right=192.1.2.23

conn ikev1-separate=
	keyexchange=ikev1
	#separate-transports=
conn ikev1-separate=yes
	keyexchange=ikev1
	separate-transports=yes
conn ikev1-separate=no
	keyexchange=ikev1
	separate-transports=no
conn ikev1-separate=auto
	keyexchange=ikev1
	separate-transports=auto

conn ikev2-separate=
	keyexchange=ikev2
	#separate-transports=
conn ikev2-separate=yes
	keyexchange=ikev2
	separate-transports=yes
conn ikev2-separate=no
	keyexchange=ikev2
	separate-transports=no
conn ikev2-separate=auto
	keyexchange=ikev2
	separate-transports=auto
