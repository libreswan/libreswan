# /etc/ipsec.conf - Libreswan IPsec configuration file

version 2.0

config setup
	child-sa-pfs-info-supported=yes
	logfile=/tmp/pluto.log
	logtime=no
	logappend=no
	plutodebug=all
	dumpdir=/tmp

conn transport-optimized-rekey
	left=192.1.2.45
	right=192.1.2.23
	type=transport
	leftid=@west
	rightid=@east
	authby=secret
	optimized-rekey=yes
	pfs=yes
	esp=aes_gcm;dh19
