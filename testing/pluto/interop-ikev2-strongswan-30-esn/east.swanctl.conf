connections {
	westnet-eastnet-ikev2 {
		#obsoleted option leftnexthop=192.1.2.23
		#=Right
		#obsoleted option rightnexthop=192.1.2.45
		fragmentation=yes
		version=2
		local_addrs=192.1.2.23
		remote_addrs=192.1.2.45
		proposals=aes128-sha1-modp2048
		children {
			westnet-eastnet-ikev2 {
				start_action=none
				esp_proposals=aes128-sha1-esn
				remote_ts=192.0.1.0/24
				local_ts=192.0.2.0/24
			}
			
		}
		local-0 {
			auth = psk
			id = @east
		}
		remote-0 {
			auth = psk
			id = @west
		}
	}
}
