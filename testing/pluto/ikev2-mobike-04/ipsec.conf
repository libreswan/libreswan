# /etc/ipsec.conf - Libreswan IPsec configuration file

config setup
	logfile=/tmp/pluto.log
	logtime=no
	logappend=no
	plutodebug=all
	dumpdir=/tmp

conn %default
	authby=secret
	mobike=yes
	esp=aes256-sha2

conn east-any
	left=%any
	leftaddresspool=198.18.66.10-198.18.66.19
	rightsubnet=0.0.0.0/0
	right=192.1.2.23

conn road-eastnet
	right=192.1.2.23
	left=%defaultroute
	rightsubnet=0.0.0.0/0
	narrowing=yes
	leftmodecfgclient=yes
