config setup
	child-sa-pfs-info-supported=yes
	logfile=/tmp/pluto.log
	logtime=no
	logappend=no
	plutodebug=all
	dumpdir=/tmp


conn west-east
	rightid=@east
	leftid=@west
	left=192.1.2.45
	right=192.1.2.23
	authby=secret
	# the IKE SA uses DH19; the Child SA pfs-info KE is DH20
	ike=aes_gcm-sha2;dh19
	esp=aes_gcm;dh19,aes_gcm;dh20
	pfs=yes
