# /etc/ipsec.conf - Libreswan IPsec configuration file

version 2.0

config setup
	child-sa-pfs-info-supported=yes
	logfile=/tmp/pluto.log
	logtime=no
	logappend=no
	plutodebug=all
	dumpdir=/tmp

conn westnet-eastnet-ikev2
	left=192.1.2.45
	right=192.1.2.23
	leftid=@west
	rightid=@east
	authby=secret
	leftsubnet=192.0.1.0/24
	rightsubnet=192.0.2.0/24
	pfs=yes
	esp=aes_gcm;dh19
