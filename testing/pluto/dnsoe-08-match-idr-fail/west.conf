# /etc/ipsec.conf - Libreswan IPsec configuration file

config setup
	logfile=/tmp/pluto.log
	logtime=no
	logappend=no
	dumpdir=/tmp
	plutodebug=all
	dnssec-enable=yes
	dnssec-rootkey-file=""
	dnssec-anchors=/testing/dnssec/keys/testing.key

conn west-east
	left=192.1.2.45
	leftid=@west.testing.libreswan.org
	
	right=192.1.2.23
	rightid=@east-private.testing.libreswan.org
	rightrsasigkey=%dnsondemand
	dns-match-id=yes
	retransmit-timeout=10s
