config setup
	logfile=/tmp/pluto.log
	logtime=no
	logappend=no
	plutodebug=all

conn %default
	left=192.1.2.45
	leftcert=west
	leftid=%fromcert
	leftsubnet=192.0.1.254/32
	right=192.1.2.23
	rightsubnet=192.0.2.254/32
	ike=aes_gcm128-sha2_256;dh19
	esp=aes_gcm128

conn cert-incorrect
	# This address is absent from east's certificate.
	rightid=192.1.2.99
	retransmit-timeout=10s

conn cert-correct
	rightid="C=CA, ST=Ontario, L=Toronto, O=Libreswan, OU=Test Department, CN=east.testing.libreswan.org, E=user-east@testing.libreswan.org"
