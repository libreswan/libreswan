# /etc/ipsec.conf - Strongswan IPsec configuration file

conn westnet-eastnet-ikev2
	#authby=rsasig
	# workaround for strongswan wanting to do RSA-v1.5-SHA1
	leftauth=ike:rsa/pss-sha256
 	rightauth=ike:rsa/pss-sha256
	left=192.1.2.45
	leftsubnet=192.0.1.0/24
	leftcert=/etc/strongswan/swanctl/x509/west.crt
	leftid="C=CA, ST=Ontario, O=Libreswan, OU=Test Department, CN=west.testing.libreswan.org, E=user-west@testing.libreswan.org"
	right=192.1.2.23
	rightsubnet=192.0.2.0/24
	rightcert=/etc/strongswan/swanctl/x509/east.crt
	rightsendcert=always
	rightid="C=CA/ST=Ontario/O=Libreswan/OU=Test Department/CN=east.testing.libreswan.org/E=user-east@testing.libreswan.org"
	# strongswan options
	keyexchange=ikev2
	auto=add

