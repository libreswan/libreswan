name: "Enforce PR Comment Rules"

on:
  issue_comment:
    types: [created, edited]

permissions: {}

jobs:
  check-comments:
    if: github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - name: Check comment text for forbidden phrases
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          FORBIDDEN_PHRASES="like to work on|want to work on"
          if printf '%s\n' "$COMMENT_BODY" | grep -qiE "$FORBIDDEN_PHRASES"; then
            echo "::error::Either do a PR or not, don't ask to work on it."
            exit 1
          fi
